<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="-apple-system, 'PingFang SC', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="300" rx="18" fill="url(#bg)"/>
  <text x="40" y="52" fill="#f8fafc" font-size="26" font-weight="700">HIDTypingFilesController</text>
  <text x="40" y="80" fill="#94a3b8" font-size="15">打包成 ASCII → 模拟键盘输入 → 校验后还原</text>

  <g>
    <rect x="40" y="120" width="230" height="130" rx="14" fill="#1d4ed8" fill-opacity="0.18" stroke="#3b82f6"/>
    <text x="60" y="152" fill="#93c5fd" font-size="13" font-weight="600">MAC</text>
    <text x="60" y="182" fill="#f8fafc" font-size="20" font-weight="700">hid_pack.py</text>
    <text x="60" y="208" fill="#cbd5e1" font-size="13">gzip + base64</text>
    <text x="60" y="228" fill="#cbd5e1" font-size="13">每行序号 + CRC32</text>
  </g>
  <g>
    <rect x="365" y="120" width="230" height="130" rx="14" fill="#16a34a" fill-opacity="0.16" stroke="#22c55e"/>
    <text x="385" y="152" fill="#86efac" font-size="13" font-weight="600">RASPBERRY PI</text>
    <text x="385" y="182" fill="#f8fafc" font-size="20" font-weight="700">USB HID 键盘</text>
    <text x="385" y="208" fill="#cbd5e1" font-size="13">只按可打印 ASCII</text>
    <text x="385" y="228" fill="#cbd5e1" font-size="13">≈ 0.03 秒 / 字符</text>
  </g>
  <g>
    <rect x="690" y="120" width="230" height="130" rx="14" fill="#d97706" fill-opacity="0.16" stroke="#f59e0b"/>
    <text x="710" y="152" fill="#fcd34d" font-size="13" font-weight="600">目标机</text>
    <text x="710" y="182" fill="#f8fafc" font-size="20" font-weight="700">java Unpack</text>
    <text x="710" y="208" fill="#cbd5e1" font-size="13">先校验全部，再写盘</text>
    <text x="710" y="228" fill="#cbd5e1" font-size="13">Java 8 兼容，零依赖</text>
  </g>
  <line x1="278" y1="185" x2="357" y2="185" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="317" y="175" fill="#94a3b8" font-size="12" text-anchor="middle">payload.txt</text>
  <line x1="603" y1="185" x2="682" y2="185" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="642" y="175" fill="#94a3b8" font-size="12" text-anchor="middle">按键</text>
</svg>
